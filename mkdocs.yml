site_name: Epic Alignment Docs
site_description: Trajectory alignment and evaluation toolkit documentation
repo_url: https://github.com/epic-lab-gwu/EPIC-Alignment
repo_name: EPIC-Alignment

theme:
  name: readthedocs

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/code-copy.js
  - javascripts/easter-egg.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/openvins-like.css

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - CLI Reference: cli.md
  - Benchmark Workflow: benchmark_workflow.md
  - OpenVINS Integration: openvins_phase2_minimal.md
  - Architecture: architecture.md
  - Troubleshooting: troubleshooting.md
  - Tool Comparison: tool_comparison.md
