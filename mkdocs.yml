site_name: Epic Alignment Docs
site_description: Trajectory alignment and evaluation toolkit documentation
repo_url: https://github.com/epic-lab-gwu/epa
repo_name: epa

theme:
  name: readthedocs

markdown_extensions:
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - javascripts/code-copy.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

extra_css:
  - stylesheets/openvins-like.css

nav:
  - Home: index.md
  - Quick Start: quickstart.md
  - CLI Reference: cli.md
  - Benchmark: benchmark.md
  - Architecture: architecture.md
  - Evaluation Inputs: evaluation_inputs.md
  - Troubleshooting: troubleshooting.md
