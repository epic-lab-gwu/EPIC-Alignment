[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vicon-ws"
version = "0.1.0"
description = "Trajectory alignment and evaluation toolkit for Vicon-grounded workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
rerun = ["rerun-sdk>=0.20"]
ros = ["rosbags>=0.11.0"]
geo = [
    "contextily>=1.5",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.6",
]

[project.scripts]
vicon_ws = "vicon_ws.cli:main"
vicon-ws = "vicon_ws.cli:main"
vicon_ws_config = "vicon_ws.config_tool:main"
vicon_ws_ape = "vicon_ws.ape_tool:main"
vicon_ws_rpe = "vicon_ws.rpe_tool:main"
vicon_ws_traj = "vicon_ws.traj_tool:main"
vicon_ws_res = "vicon_ws.benchmark.res:main"
vicon_ws_benchmark = "vicon_ws.benchmark.alignanything_harness:main"
vicon_ws_plot_summary = "vicon_ws.benchmark.plot_summary:main"
vicon_ws_metric_res = "vicon_ws.benchmark.metrics_res:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src", "tests/unit", "pipeline.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "sqrtVINS-main",
    "AlignAnything",
    "outputs",
]

[tool.ruff.lint]
select = ["F"]
