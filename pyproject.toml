[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "epic-alignment"
version = "0.1.0"
description = "Trajectory alignment and evaluation toolkit for Vicon-grounded workflows"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.8",
    "matplotlib>=3.5",
]

[project.optional-dependencies]
rerun = ["rerun-sdk>=0.20"]
ros = ["rosbags>=0.11.0"]
geo = [
    "contextily>=1.5",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.6",
]
ipython = ["ipython>=8.0"]

[project.scripts]
epa = "epa.cli:main"
epic-alignment = "epa.cli:main"
epa_config = "epa.config_tool:main"
epa_ape = "epa.ape_tool:main"
epa_rpe = "epa.rpe_tool:main"
epa_traj = "epa.traj_tool:main"
epa_fig = "epa.fig_tool:main"
epa_res = "epa.benchmark.res:main"
epa_benchmark = "epa.benchmark.alignanything_harness:main"
epa_plot_summary = "epa.benchmark.plot_summary:main"
epa_metric_res = "epa.benchmark.metrics_res:main"
epa_ipython = "epa.ipython_tool:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
files = ["src", "tests/unit", "pipeline.py"]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "sqrtVINS-main",
    "AlignAnything",
    "outputs",
]

[tool.ruff.lint]
select = ["F"]
